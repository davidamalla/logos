name: miEPG

on:
  schedule:
    # Nota: Los horarios cron en GitHub están en UTC (en España suma +1h en invierno o +2h en verano)
    - cron: '55 3 * * *'
    - cron: '55 6 * * *'
    - cron: '55 10 * * *'
    - cron: '55 14 * * *'
    - cron: '55 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Dar permisos y ejecutar script
        run: |
          chmod +x .github/workflows/EPG_script.sh
          .github/workflows/EPG_script.sh

      - name: Configurar identidad de Git y subir cambios
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          # Solo hace commit y push si realmente hay cambios en los archivos
          if ! git diff --staged --quiet; then
            git commit -m "Nuevo miEPG.xml"
            git pull --rebase origin main
            git push
          else
            echo "No hay cambios nuevos para subir."
          fi
