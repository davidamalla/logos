name: miEPG

on:
  # schedule:
  #   - cron: '15 11,17 * * * ' # Ejecutar a las 12:15 PM y 18:15 PM hora peninsular española (CET / UTC+1)
  repository_dispatch:
    types: [trigger-desde-GAS] # Se activará instantáneamente cuando Google envíe este evento
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4 # ACTUALIZADO desde v2: Evita fallos de Node.js y rendimiento

    - name: Comprobar e Instalar xmllint
      run: |
        sudo apt-get update && sudo apt-get install -y libxml2-utils

    - name: Dar permisos de ejecución al script
      run: |
        chmod +x .github/workflows/EPG_script.sh

    - name: Ejecutar script
      run: .github/workflows/EPG_script.sh

    - name: Configurar identidad de Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
    - name: Subir archivos 
      run: |
        git add .
        git diff --cached --quiet || (
            git commit -m "Nuevo miEPG.xml" &&
            git push
        )
